<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Painel de Horários • Estação Central</title>

  <!-- Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet" />
  <!-- Fonte (simples e bem legível) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --blueA:#1f4f8f;
      --blueB:#3b82c4;
      --yellow:#facc15;

      --bg:#eef2f7;
      --card:#ffffff;
      --stroke:#e5e7eb;
      --shadow: 0 10px 24px rgba(15, 23, 42, .10);

      --text:#0f172a;
      --muted:#475569;

      --green:#22c55e;
      --greenDark:#16a34a;

      --vjd:#1e3a8a;
      --vsr:#0ea5e9;

      --glass: rgba(255,255,255,.50);
      --glassStroke: rgba(255,255,255,.65);

      --r: 16px;
      --pad: clamp(14px, 1.8vw, 20px);
    }

    *{ box-sizing:border-box; }
    html, body{ height:100%; }
    body{
      margin:0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow:hidden;
    }

    /* HEADER (estilo do anexo) */
    .header{
      height: 120px;
      padding: 18px 22px;
      background: linear-gradient(90deg, var(--blueA), var(--blueB));
      color: #fff;
      display:flex;
      align-items:center;
      justify-content:space-between;
      border-bottom: 4px solid var(--yellow);
    }

    .h-left{
      display:flex;
      align-items:center;
      gap: 16px;
      min-width: 0;
    }

    .h-icon{
      width: 54px; height:54px;
      display:grid; place-items:center;
      border-radius: 14px;
      background: rgba(255,255,255,.18);
      border: 1px solid rgba(255,255,255,.22);
    }
    .h-icon .material-icons-outlined{ font-size:30px; }

    .h-titles{
      display:flex;
      flex-direction:column;
      gap: 6px;
      min-width:0;
    }
    .h-title{
      font-size: clamp(24px, 3.0vw, 38px);
      font-weight: 800;
      letter-spacing: .06em;
      text-transform: uppercase;
      line-height: 1;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .h-sub{
      display:flex;
      align-items:center;
      gap: 10px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      opacity:.95;
    }
    .h-sub .material-icons-outlined{ font-size:20px; opacity:.95; }

    /* relógio no canto (como no anexo) */
    .clockBox{
      min-width: 290px;
      text-align:right;
      padding: 14px 16px;
      border-radius: 14px;
      background: rgba(255,255,255,.18);
      border: 1px solid rgba(255,255,255,.22);
    }
    .clock{
      font-size: clamp(34px, 4.2vw, 52px);
      font-weight: 900;
      letter-spacing: .02em;
      color: var(--yellow);
      line-height: 1;
    }
    .clockDate{
      margin-top: 6px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      opacity:.95;
      color: #fff;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    /* CONTEÚDO */
    .main{
      height: calc(100% - 120px);
      padding: 18px 22px;
      display:grid;
      grid-template-rows: auto 1fr auto;
      gap: 12px;
    }

    .topRow{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
    }

    .status{
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .10em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* progress bar de troca de página */
    .pager{
      display:flex;
      align-items:center;
      gap: 12px;
      min-width: 360px;
      justify-content:flex-end;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .10em;
      text-transform: uppercase;
    }
    .bar{
      width: 220px;
      height: 10px;
      border-radius: 999px;
      background: #dbe3ef;
      overflow:hidden;
      border: 1px solid #cfd8e6;
    }
    .bar > div{
      height:100%;
      width:0%;
      background: linear-gradient(90deg, #60a5fa, #2563eb);
      border-radius: 999px;
      transition: width 120ms linear;
    }

    /* LISTA / PÁGINA */
    .pageWrap{
      background: transparent;
      overflow:hidden;
      display:grid;
      align-content:start;
      gap: 14px;
    }

    .empty{
      padding: 32px;
      background: var(--card);
      border: 1px solid var(--stroke);
      border-radius: var(--r);
      box-shadow: var(--shadow);
      text-align:center;
      color: var(--muted);
      font-weight: 800;
      letter-spacing: .10em;
      text-transform: uppercase;
    }

    /* CARD simples (estilo do anexo) */
    .card{
      background: var(--card);
      border: 1px solid var(--stroke);
      border-radius: var(--r);
      box-shadow: var(--shadow);
      display:grid;
      grid-template-columns: 140px 1fr 280px;
      gap: 14px;
      align-items:center;
      padding: 18px 18px;
      position:relative;
    }

    /* “faixa” azul na esquerda */
    .card::before{
      content:"";
      position:absolute;
      left:0; top:0; bottom:0;
      width: 6px;
      border-radius: var(--r) 0 0 var(--r);
      background: #2563eb;
    }

    .lineCol{
      display:flex;
      flex-direction:column;
      gap: 10px;
      padding-left: 6px;
      align-items:flex-start;
    }
    .lineNum{
      font-size: 52px;
      font-weight: 900;
      letter-spacing: .02em;
      line-height: 1;
      color: #111827;
    }

    /* badge (mantém glass, mas discreto) */
    .badge{
      display:inline-flex;
      align-items:center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--glass);
      border: 1px solid var(--glassStroke);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .10em;
      text-transform: uppercase;
      color: #0f172a;
    }
    .dot{
      width: 10px;
      height: 10px;
      border-radius: 50%;
      box-shadow: 0 0 0 2px rgba(15,23,42,.06) inset;
    }

    .midCol{
      min-width:0;
      display:flex;
      flex-direction:column;
      gap: 8px;
    }

    /* ✅ Destino maior (mais legível) */
    .destName{
      font-size: clamp(22px, 2.4vw, 34px);
      font-weight: 900;
      letter-spacing: .02em;
      line-height: 1.1;
      text-transform: uppercase;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .meta{
      font-size: 14px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: .06em;
      text-transform: uppercase;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .timeCol{
      display:flex;
      flex-direction:column;
      align-items:flex-end;
      gap: 10px;
    }

    /* destaque do próximo horário (HH:MM) */
    .nextTime{
      width: 100%;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 14px 16px;
      border-radius: 12px;
      background: var(--green);
      color: #fff;
      font-weight: 900;
      font-size: 40px;
      letter-spacing: .02em;
      box-shadow: 0 10px 18px rgba(34,197,94,.25);
    }

    .moreRow{
      display:flex;
      gap: 8px;
      justify-content:flex-end;
      flex-wrap:nowrap;
      width: 100%;
    }
    .pill{
      padding: 8px 10px;
      border-radius: 10px;
      background: #eef2f7;
      border: 1px solid #e5e7eb;
      font-size: 14px;
      font-weight: 900;
      color: #334155;
      letter-spacing: .06em;
      min-width: 72px;
      text-align:center;
    }

    .footerRow{
      display:flex;
      align-items:center;
      justify-content:space-between;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .10em;
      text-transform: uppercase;
      padding: 0 2px;
    }

    /* Responsivo */
    @media (max-width: 980px){
      .header{ height:auto; flex-direction:column; align-items:flex-start; gap: 14px; }
      .clockBox{ width:100%; text-align:left; }
      .main{ height:auto; }
      body{ overflow:auto; }
      .card{ grid-template-columns: 1fr; }
      .timeCol{ align-items:flex-start; }
      .moreRow{ justify-content:flex-start; }
    }
  </style>
</head>

<body>
  <header class="header">
    <div class="h-left">
      <div class="h-icon"><span class="material-icons-outlined" aria-hidden="true">directions_bus</span></div>
      <div class="h-titles">
        <div class="h-title">Painel de Horários</div>
        <div class="h-sub">
          <span class="material-icons-outlined" aria-hidden="true">location_on</span>
          <span>Estação Central</span>
        </div>
      </div>
    </div>

    <div class="clockBox" aria-label="Relógio e data">
      <div class="clock" id="clock">--:--</div>
      <div class="clockDate" id="clockDate">—</div>
    </div>
  </header>

  <main class="main">
    <div class="topRow">
      <div class="status" id="status">Carregando linhas…</div>

      <div class="pager">
        <span id="pageLabel">PÁGINA 1/1</span>
        <div class="bar" aria-hidden="true"><div id="barFill"></div></div>
      </div>
    </div>

    <section class="pageWrap" id="pageWrap"></section>

    <div class="footerRow">
      <div id="lastUpdate">—</div>
      <div>Somente próximas 2 horas</div>
    </div>
  </main>

  <script>
    /*******************************************************************
     * 🔑 INSIRA AQUI SUA GOOGLE MAPS API KEY (ÚNICO LUGAR)
     *******************************************************************/
    const GOOGLE_MAPS_API_KEY = "AIzaSyA5jfERk5m06bl0eQnFLWSYbFhsQFglyO8";

    /*******************************************************************
     * CONFIG
     *******************************************************************/
    const STATION = { lat: -19.5368231, lng: -40.633973 };
    const SWEEP_POINTS = 12;
    const SWEEP_RADIUS_M = 1200;

    const REFRESH_EVERY_MS = 10 * 60 * 1000; // 10 min
    const WINDOW_NEXT_HOURS = 2;             // próximas 2h
    const MAX_TIMES_PER_LINE = 4;            // 1 destaque + 3 próximos

    // Paginação (substitui scroll)
    const ITEMS_PER_PAGE = 6;                // quantos cards por tela
    const PAGE_DURATION_MS = 12000;          // troca automática (12s)

    /*******************************************************************
     * UI refs
     *******************************************************************/
    const statusEl = document.getElementById("status");
    const pageWrapEl = document.getElementById("pageWrap");
    const lastUpdateEl = document.getElementById("lastUpdate");
    const pageLabelEl = document.getElementById("pageLabel");
    const barFillEl = document.getElementById("barFill");
    const clockEl = document.getElementById("clock");
    const clockDateEl = document.getElementById("clockDate");

    /*******************************************************************
     * Clock (SEM segundos) + data (simples)
     *******************************************************************/
    const weekday = ["DOMINGO","SEGUNDA","TERÇA","QUARTA","QUINTA","SEXTA","SÁBADO"];
    const month   = ["JANEIRO","FEVEREIRO","MARÇO","ABRIL","MAIO","JUNHO","JULHO","AGOSTO","SETEMBRO","OUTUBRO","NOVEMBRO","DEZEMBRO"];
    function pad2(n){ return String(n).padStart(2,"0"); }

    function tickClock(){
      const d = new Date();
      clockEl.textContent = `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
      clockDateEl.textContent = `${weekday[d.getDay()]}, ${pad2(d.getDate())} DE ${month[d.getMonth()]}`;
    }
    function startClock(){
      tickClock();
      const ms = 1000 - new Date().getMilliseconds();
      setTimeout(() => { tickClock(); setInterval(tickClock, 1000); }, ms);
    }

    /*******************************************************************
     * Loader Google Maps
     *******************************************************************/
    function loadGoogleMaps(){
      return new Promise((resolve, reject) => {
        if (window.google?.maps) return resolve();

        const key = (GOOGLE_MAPS_API_KEY || "").trim();
        if (!key || key === "COLE_SUA_API_KEY_AQUI"){
          statusEl.textContent = "Insira sua Google Maps API Key no código.";
          return reject(new Error("Missing API key"));
        }

        window.__gmReady = () => resolve();

        const script = document.createElement("script");
        script.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(key)}&callback=__gmReady`;
        script.async = true;
        script.defer = true;
        script.onerror = () => reject(new Error("Failed to load Google Maps"));
        document.head.appendChild(script);
      });
    }

    /*******************************************************************
     * Geodesia (12 destinos ao redor)
     *******************************************************************/
    function toRad(deg){ return deg * Math.PI / 180; }
    function toDeg(rad){ return rad * 180 / Math.PI; }

    function destinationPoint(lat, lng, bearingDeg, distanceM){
      const R = 6371000;
      const brng = toRad(bearingDeg);
      const dDivR = distanceM / R;
      const lat1 = toRad(lat);
      const lon1 = toRad(lng);

      const lat2 = Math.asin(
        Math.sin(lat1)*Math.cos(dDivR) +
        Math.cos(lat1)*Math.sin(dDivR)*Math.cos(brng)
      );
      const lon2 = lon1 + Math.atan2(
        Math.sin(brng)*Math.sin(dDivR)*Math.cos(lat1),
        Math.cos(dDivR) - Math.sin(lat1)*Math.sin(lat2)
      );

      return { lat: toDeg(lat2), lng: toDeg(lon2) };
    }

    function buildSweepDestinations(){
      const points = [];
      for (let i=0;i<SWEEP_POINTS;i++){
        const bearing = i * (360 / SWEEP_POINTS);
        points.push(destinationPoint(STATION.lat, STATION.lng, bearing, SWEEP_RADIUS_M));
      }
      return points;
    }

    /*******************************************************************
     * Helpers: tempo do Maps (Date vs number) — robusto
     *******************************************************************/
    function normalizeTimeValue(value){
      if (value instanceof Date) return value.getTime();
      if (typeof value === "number" && Number.isFinite(value)){
        return value < 1e12 ? value * 1000 : value;
      }
      const n = Number(value);
      if (Number.isFinite(n)) return n < 1e12 ? n * 1000 : n;
      return null;
    }

    function fmtHHMM(ms){
      const d = new Date(ms);
      return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
    }

    /*******************************************************************
     * Empresa por faixa
     *******************************************************************/
    function companyFromLineNumber(lineShort){
      const n = parseInt(String(lineShort).replace(/\D/g,""), 10);
      if (!Number.isFinite(n)) return { code:"VJD", color:"var(--vjd)" };
      if (n >= 300 && n <= 499) return { code:"VSR", color:"var(--vsr)" };
      return { code:"VJD", color:"var(--vjd)" };
    }

    /*******************************************************************
     * Parse Directions (TRANSIT)
     *******************************************************************/
    function extractTripsFromDirectionsResult(result){
      const trips = [];
      if (!result?.routes?.length) return trips;

      for (const route of result.routes){
        const leg = route.legs?.[0];
        if (!leg?.steps?.length) continue;

        for (const step of leg.steps){
          if (step.travel_mode !== "TRANSIT" || !step.transit) continue;

          const td = step.transit;
          const lineShort = td.line?.short_name || td.line?.name || "—";
          const headsign = td.headsign || td.line?.name || td.arrival_stop?.name || "Destino";

          const depVal = td.departure_time?.value ?? null;
          const arrVal = td.arrival_time?.value ?? null;

          const timeMs = normalizeTimeValue(arrVal) ?? normalizeTimeValue(depVal);
          if (!timeMs) continue;

          trips.push({
            line: String(lineShort),
            destination: String(headsign),
            timeMs,
            key: `${String(lineShort)}|${String(headsign)}|${timeMs}`
          });
        }
      }
      return trips;
    }

    /*******************************************************************
     * Dedup + janela 2h + agrupamento
     *******************************************************************/
    function aggregateTrips(allTrips){
      const now = Date.now();
      const windowEnd = now + WINDOW_NEXT_HOURS * 60 * 60 * 1000;

      const uniqMap = new Map();
      for (const t of allTrips) uniqMap.set(t.key, t);
      const uniq = Array.from(uniqMap.values());

      const filtered = uniq.filter(t => t.timeMs >= now - 30_000 && t.timeMs <= windowEnd);

      const groups = new Map();
      for (const t of filtered){
        const k = `${t.line}||${t.destination}`;
        if (!groups.has(k)) groups.set(k, { line: t.line, destination: t.destination, times: [] });
        groups.get(k).times.push(t.timeMs);
      }

      const cards = [];
      for (const g of groups.values()){
        g.times.sort((a,b) => a-b);
        g.times = g.times.slice(0, MAX_TIMES_PER_LINE);
        if (!g.times.length) continue;

        cards.push({ line: g.line, destination: g.destination, times: g.times, nextTime: g.times[0] });
      }

      cards.sort((a,b) => a.nextTime - b.nextTime);
      return cards;
    }

    /*******************************************************************
     * Directions runner (12 requests)
     *******************************************************************/
    let directionsService = null;

    function requestDirectionsTo(dest){
      return new Promise((resolve) => {
        const req = {
          origin: STATION,
          destination: dest,
          travelMode: google.maps.TravelMode.TRANSIT,
          provideRouteAlternatives: true,
          transitOptions: { departureTime: new Date() }
        };

        directionsService.route(req, (result, status) => {
          if (status === "OK" && result) resolve({ ok:true, result });
          else resolve({ ok:false, status });
        });
      });
    }

    /*******************************************************************
     * PAGINAÇÃO automática + barra
     *******************************************************************/
    let allCards = [];
    let currentPage = 0;
    let pageTimer = null;
    let barTimer = null;
    let pageStartTs = 0;

    function stopPager(){
      if (pageTimer) clearInterval(pageTimer);
      if (barTimer) clearInterval(barTimer);
      pageTimer = null;
      barTimer = null;
    }

    function pageCount(){
      return Math.max(1, Math.ceil(allCards.length / ITEMS_PER_PAGE));
    }

    function renderPage(pageIndex){
      const totalPages = pageCount();
      currentPage = ((pageIndex % totalPages) + totalPages) % totalPages;

      const start = currentPage * ITEMS_PER_PAGE;
      const slice = allCards.slice(start, start + ITEMS_PER_PAGE);

      pageLabelEl.textContent = `PÁGINA ${currentPage + 1}/${totalPages}`;
      pageWrapEl.innerHTML = "";

      if (!slice.length){
        pageWrapEl.innerHTML = `<div class="empty">Sem horários nas próximas ${WINDOW_NEXT_HOURS} horas.</div>`;
        return;
      }

      const frag = document.createDocumentFragment();

      for (const c of slice){
        const company = companyFromLineNumber(c.line);
        const nextClock = fmtHHMM(c.times[0]);
        const more = c.times.slice(1, 4);

        const el = document.createElement("div");
        el.className = "card";
        el.innerHTML = `
          <div class="lineCol">
            <div class="lineNum">${escapeHtml(c.line)}</div>
            <div class="badge">
              <span class="dot" style="background:${company.color}"></span>
              <span>${company.code}</span>
            </div>
          </div>

          <div class="midCol">
            <div class="destName" title="${escapeHtml(c.destination)}">${escapeHtml(c.destination)}</div>
            <div class="meta">Próximo: ${nextClock}</div>
          </div>

          <div class="timeCol">
            <div class="nextTime">${nextClock}</div>
            <div class="moreRow">
              ${more.length ? more.map(ms => `<div class="pill">${fmtHHMM(ms)}</div>`).join("") : `<div class="pill" style="opacity:.6">—</div>`}
            </div>
          </div>
        `;
        frag.appendChild(el);
      }

      pageWrapEl.appendChild(frag);
    }

    function startPager(){
      stopPager();
      renderPage(0);

      pageStartTs = performance.now();
      barFillEl.style.width = "0%";

      // barra (atualiza ~10x/s)
      barTimer = setInterval(() => {
        const elapsed = performance.now() - pageStartTs;
        const pct = Math.min(100, (elapsed / PAGE_DURATION_MS) * 100);
        barFillEl.style.width = pct.toFixed(1) + "%";
      }, 100);

      // troca de página
      pageTimer = setInterval(() => {
        pageStartTs = performance.now();
        barFillEl.style.width = "0%";
        renderPage(currentPage + 1);
      }, PAGE_DURATION_MS);
    }

    /*******************************************************************
     * Render helpers
     *******************************************************************/
    function escapeHtml(s){
      return String(s).replace(/[&<>"']/g, (m) => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
      }[m]));
    }

    /*******************************************************************
     * Refresh data
     *******************************************************************/
    async function refreshData(){
      statusEl.textContent = "Buscando linhas…";
      const t0 = performance.now();

      if (!directionsService) directionsService = new google.maps.DirectionsService();

      const destinations = buildSweepDestinations();
      const responses = await Promise.all(destinations.map(d => requestDirectionsTo(d)));

      const trips = [];
      let ok = 0;
      for (const r of responses){
        if (r.ok){
          ok++;
          trips.push(...extractTripsFromDirectionsResult(r.result));
        }
      }

      allCards = aggregateTrips(trips);

      const now = new Date();
      lastUpdateEl.textContent = `Atualizado • ${pad2(now.getHours())}:${pad2(now.getMinutes())}`;
      statusEl.textContent = ok ? `Linhas exibidas: ${allCards.length} • Janela: ${WINDOW_NEXT_HOURS}h` : "Sem resposta da API (verifique key/restrições).";

      // reinicia paginação sempre que atualizar os dados (mantém claro e previsível)
      startPager();

      const dt = Math.round(performance.now() - t0);
      // (dt fica só no console para não poluir a tela)
      console.log("refreshData ms:", dt, "cards:", allCards.length, "ok:", ok);
    }

    function scheduleRefresh(){
      setInterval(refreshData, REFRESH_EVERY_MS);
    }

    /*******************************************************************
     * BOOT
     *******************************************************************/
    startClock();

    (async function boot(){
      try{
        await loadGoogleMaps();
        statusEl.textContent = "Atualizando…";
        await refreshData();
        scheduleRefresh();
      }catch(err){
        statusEl.textContent = "Insira uma API Key válida (Google Maps).";
        console.warn(err);
      }
    })();
  </script>
</body>
</html>
